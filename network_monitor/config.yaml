name: Linkwatch
version: "1.4.1"
slug: home_network_monitor
description: Local network health, traffic, device evidence and outage alerts
url: https://github.com/sepal7/linkwatch
arch:
  - aarch64
  - amd64
startup: application
boot: auto
stage: experimental
backup: cold
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-check
panel_title: Linkwatch
homeassistant_api: true
audio: true
map:
  - type: media
    read_only: false
options:
  interval_seconds: 2
  timeout_seconds: 1
  external_targets:
    - "1.1.1.1:443"
    - "8.8.8.8:53"
  router_host: ""
  router_port: 80
  dns_server: ""
  dns_test_name: example.com
  retention_days: 7
  max_samples: 200000
  alert_failure_seconds: 15
  alert_recovery_seconds: 10
  alerts_enabled: false
  sound_output: cast
  media_player: ""
  phone_notify_service: ""
  telemetry_interval_seconds: 15
  unifi_url: ""
  unifi_api_key: ""
  unifi_site_id: ""
  unifi_username: ""
  unifi_password: ""
  unifi_legacy_site: default
  unifi_tls_fingerprint: ""
  pihole_url: ""
  pihole_password: ""
  pihole_tls_fingerprint: ""
  starlink_entities: []
  internet_entities: []
  ha_discovery_enabled: false
  unifi_activity_enabled: false
  pihole_actions_enabled: false
  pihole_action_group_ids: []
  unifi_controls_enabled: false
  unifi_control_username: ""
  unifi_control_password: ""
  unifi_control_ha_ip: ""
  unifi_control_client_macs: []
schema:
  interval_seconds: int(2,300)
  timeout_seconds: int(1,10)
  external_targets:
    - str
  router_host: str
  router_port: port
  dns_server: str
  dns_test_name: str
  retention_days: int(1,90)
  max_samples: int(1000,1000000)
  alert_failure_seconds: int(0,600)
  alert_recovery_seconds: int(0,600)
  alerts_enabled: bool
  sound_output: list(local|cast|both|none)
  media_player: str
  phone_notify_service: str
  telemetry_interval_seconds: int(10,300)
  unifi_url: str
  unifi_api_key: password
  unifi_site_id: str
  unifi_username: str
  unifi_password: password
  unifi_legacy_site: str
  unifi_tls_fingerprint: str
  pihole_url: str
  pihole_password: password
  pihole_tls_fingerprint: str
  starlink_entities:
    - str
  internet_entities:
    - str
  ha_discovery_enabled: bool
  unifi_activity_enabled: bool
  pihole_actions_enabled: bool
  pihole_action_group_ids:
    - int(1,2147483647)
  unifi_controls_enabled: bool
  unifi_control_username: str
  unifi_control_password: password
  unifi_control_ha_ip: str
  unifi_control_client_macs:
    - str
