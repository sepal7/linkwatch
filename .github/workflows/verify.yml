name: Verify app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r network_monitor/requirements.txt pyyaml ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: node --check network_monitor/app/static/dashboard.js
      - run: node --check network_monitor/app/static/telemetry.js
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: network_monitor
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Verify native host-audio playback with a synthetic sink
        run: |
          docker build --quiet --tag linkwatch-audio network_monitor
          docker run --rm --entrypoint sh -v "$PWD/tests/audio_smoke.sh:/audio_smoke.sh:ro" linkwatch-audio /audio_smoke.sh
